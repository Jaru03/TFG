# Configuración de Nginx para el contenedor del cliente.
# Sirve el SPA de React y hace de proxy inverso hacia el backend.
# "backend" es el nombre del servicio del backend en docker-compose.

upstream edutech_backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida (portadas de curso y adjuntos de lección).
    client_max_body_size 25m;

    # Compresión de los recursos estáticos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API, autenticación y ficheros subidos → backend.
    location ~ ^/(api|auth|uploads)/ {
        proxy_pass http://edutech_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Imprescindible para que el backend (con `trust proxy`) sepa que la
        # conexión original es HTTPS y emita la cookie de sesión `secure`.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier otra ruta devuelve index.html (React Router enruta en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets con hash (Vite genera nombres versionados).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
