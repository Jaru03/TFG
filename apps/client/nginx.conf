# Configuración de Nginx para el contenedor del cliente.
# Sirve el SPA de React y hace de proxy inverso hacia el backend.
# "backend" es el nombre del servicio del backend en docker-compose.

# Conserva el X-Forwarded-Proto que llega del Nginx del host (https). Solo si no
# viene ninguno (acceso directo al contenedor) se usa el esquema local. Esto es
# imprescindible en el doble proxy host → client → backend para que la cookie
# de sesión `secure` se emita correctamente.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

upstream edutech_backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida (portadas de curso y adjuntos de lección).
    client_max_body_size 25m;

    # Compresión de los recursos estáticos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API, autenticación y ficheros subidos → backend.
    location ~ ^/(api|auth|uploads)/ {
        proxy_pass http://edutech_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Reenvía el esquema original (https desde el Nginx del host), no el
        # del tramo interno. Necesario para la cookie de sesión `secure`.
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # SPA: cualquier otra ruta devuelve index.html (React Router enruta en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets con hash (Vite genera nombres versionados).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
